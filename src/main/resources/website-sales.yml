# Disabled by default. The default listener binds to loopback.
# Verify currency and configure dedicated environment variables before enabling:
# ENTHUSIA_MARKET_SALES_CURRENCY=RAW_GOLD
# ENTHUSIA_MARKET_SALES_TOKEN=<dedicated secret, at least 32 characters>
# ENTHUSIA_MARKET_SALES_GENERATION_FILE=<external control file containing a canonical UUID>
# Protocol v2 requires an upgraded, fenced website consumer. Do not enable until
# restore rotation, reconciliation, and end-to-end verification are complete.
# Expose through an authenticated HTTPS proxy. Restart after changes.
enabled: false
port: 8124
bind-address: "127.0.0.1"
# Managed hosting can use -Denthusiamarket.sales.currency=RAW_GOLD and these
# files instead of the corresponding environment variables.
token-file: ""
generation-file: ""
