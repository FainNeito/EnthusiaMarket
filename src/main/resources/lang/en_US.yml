    result: "<prefix><#FFF6E0><shadow:#000000:1>Sign refresh: fixed=<#B6D7A8><fixed></#B6D7A8> skipped=<#FFCF1F><skipped></#FFCF1F> errors=<#FFD0C6><errors></#FFD0C6></shadow></#FFF6E0>"

