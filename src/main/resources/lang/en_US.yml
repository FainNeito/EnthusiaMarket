      owned: "<#FFF6E0>Owned</#FFF6E0>"
      grace: "<#FFCF1F>Rent overdue</#FFCF1F>"
      moderation_hold: "<#FFD0C6>On hold</#FFD0C6>"
      re_auctioning: "<#FFCF1F>At re-auction</#FFCF1F>"
      emergency_auctioning: "<#FFD0C6>Emergency auction</#FFD0C6>"
    line: "<#FFF6E0><shadow:#000000:1>  <#FFCF1F><id></#FFCF1F> <#FFF6E0>[<state>]</#FFF6E0> region=<world>:<region></shadow></#FFF6E0>"
  rg_resync:
    result: "<prefix><#FFF6E0><shadow:#000000:1>WG resync: fixed=<#B6D7A8><fixed></#B6D7A8> skipped=<#FFCF1F><skipped></#FFCF1F> errors=<#FFD0C6><errors></shadow></#FFF6E0>"
  auction:
    start:
      success: "<prefix><shadow:#000000:1><#B6D7A8>Auction created:</#B6D7A8> <#FFF6E0>for stall</#FFF6E0> <#FFCF1F><stall></#FFCF1F> <#FFF6E0>starting at</#FFF6E0> <#FFCF1F><starting_bid></shadow>"
      failure: "<prefix><shadow:#000000:1><#FFD0C6>Failed to create auction: <reason></shadow>"
      not_found: "<prefix><shadow:#000000:1><#FFD0C6>Stall not found</shadow>"
    cancel:
      success: "<prefix><shadow:#000000:1><#B6D7A8>Auction cancelled:</#B6D7A8> <#FFCF1F><stall></#FFCF1F></shadow>"
      failure: "<prefix><shadow:#000000:1><#FFD0C6>Failed to cancel auction: <reason></shadow>"
      not_found: "<prefix><shadow:#000000:1><#FFD0C6>Auction not found</shadow>"
    startall:
      result: "<prefix><shadow:#000000:1><#B6D7A8>mass auction:</#B6D7A8> created=<#B6D7A8><created></#B6D7A8> skipped=<#FFCF1F><skipped></#FFCF1F> errors=<#FFD0C6><errors></#FFD0C6></shadow>"
      failure: "<prefix><shadow:#000000:1><#FFD0C6>mass auction failed: <reason></shadow>"
    cancelall:
      done: "<prefix><shadow:#000000:1><#B6D7A8><count> auction(s) cancelled.</#B6D7A8> Current high bidders refunded.</shadow>"
    extend:
      success: "<prefix><shadow:#000000:1><#B6D7A8>Auction extended:</#B6D7A8> <id> <#FFF6E0>on stall</#FFF6E0> <#FFCF1F><stall></#FFCF1F> <#FFF6E0>now ends at</#FFF6E0> <#FFF6E0><end_at></shadow>"
      failure: "<prefix><shadow:#000000:1><#FFD0C6>Failed to extend auction: <reason></shadow>"
      not_found: "<prefix><shadow:#000000:1><#FFD0C6>Auction not found</shadow>"
    clear:
      done: "<prefix><shadow:#000000:1><#B6D7A8>Cleared stale bid data</#B6D7A8> <#FFF6E0>for</#FFF6E0> <#FFCF1F><stall></#FFCF1F><#FFF6E0>:</#FFF6E0> <#FFF6E0><count></#FFF6E0> <#FFF6E0>auction(s) cleaned</#FFF6E0></shadow>"
  bid:
    success: "<prefix><shadow:#000000:1><#B6D7A8>Bid placed:</#B6D7A8> <#FFCF1F><amount></#FFCF1F> <#FFF6E0>on</#FFF6E0> <#FFCF1F><stall></#FFCF1F></shadow>"
    failure: "<prefix><shadow:#000000:1><#FFD0C6>Bid rejected: <reason></shadow>"
    not_found: "<prefix><shadow:#000000:1><#FFD0C6>Auction not found</shadow>"
  evict:
    success: "<prefix><shadow:#000000:1><#B6D7A8>Evicted</#B6D7A8> <#FFCF1F><stall></#FFCF1F> <#B6D7A8>— reset to unowned and WG cleared.</shadow>"
    not_found: "<prefix><shadow:#000000:1><#FFD0C6>Stall not found:</#FFD0C6> <#FFCF1F><stall></#FFCF1F></shadow>"
    not_owned: "<prefix><shadow:#000000:1><#FFCF1F>Stall</#FFCF1F> <#FFCF1F><stall></#FFCF1F> <#FFCF1F>is not currently owned.</shadow>"
    blocked: "<prefix><shadow:#000000:1><#FFCF1F>Stall</#FFCF1F> <#FFCF1F><stall></#FFCF1F> <#FFCF1F>is temporarily unavailable while moderation is active.</shadow>"
  maintenance:
    freeze:
      activated: "<prefix><shadow:#000000:1><#B6D7A8>Maintenance freeze ACTIVE</#B6D7A8> — all rent and auction timers are paused. Run <#FFF6E0>/em maintenance unfreeze</#FFF6E0> when the server is back.</shadow>"
      already_active: "<prefix><shadow:#000000:1><#FFF6E0>Maintenance freeze is already active</#FFF6E0> <#FFF6E0>(since</#FFF6E0> <#FFCF1F><since></#FFCF1F><#FFF6E0>)</#FFF6E0>.</shadow>"
    unfreeze:
      done: "<prefix><shadow:#000000:1><#B6D7A8>Maintenance freeze lifted.</#B6D7A8> <#FFF6E0>Shifted</#FFF6E0> <#FFCF1F><stalls></#FFCF1F> <#FFF6E0>stall rent deadline(s) and</#FFF6E0> <#FFCF1F><auctions></#FFCF1F> <#FFF6E0>auction(s) forward by</#FFF6E0> <#FFF6E0><duration></#FFF6E0><#FFF6E0>.</#FFF6E0></shadow>"
      not_frozen: "<prefix><shadow:#000000:1><#FFF6E0>No maintenance freeze is active.</#FFF6E0></shadow>"
    status:
      active: "<prefix><#FFF6E0><shadow:#000000:1>Maintenance freeze: <#B6D7A8>ACTIVE</#B6D7A8> <#FFF6E0>since</#FFF6E0> <#FFCF1F><since></#FFCF1F> <#FFF6E0>(frozen for</#FFF6E0> <#FFF6E0><duration></#FFF6E0><#FFF6E0>)</#FFF6E0>.</shadow></#FFF6E0>"
      inactive: "<prefix><#FFF6E0><shadow:#000000:1>Maintenance freeze: <#FFF6E0>inactive</#FFF6E0>.</shadow></#FFF6E0>"
  limit:
    header: "<shadow:#000000:1><#FFCF1F>Your stall limits</shadow>"
    total: "<shadow:#000000:1><#FFF6E0>Total: <#FFF6E0><used></#FFF6E0> / <#FFCF1F><cap></shadow>"
    kind: "<shadow:#000000:1><#FFF6E0>  <#FFF6E0><kind></#FFF6E0>: <#FFF6E0><used></#FFF6E0> / <#FFCF1F><cap></shadow>"
    unlimited: "<shadow:#000000:1><#B6D7A8>∞</shadow>"
