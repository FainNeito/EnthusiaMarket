# EnthusiaMarket — en_US locale.
#
# All values are MiniMessage strings. See https://docs.advntr.dev/minimessage/format.html
# Placeholders use <name> syntax and are populated at call site, e.g. <stall>, <count>.
#
# Bedrock/Cumulus paths render these to legacy §-codes via LegacyComponentSerializer.

prefix: "<gradient:#E4AB65:#F2B66D><shadow:#000000:1>[Market]</shadow></gradient> "

common:
  unknown_player: "<#FFF6E0><shadow:#000000:1>Unknown</shadow></#FFF6E0>"

admin:
  import:
    result: "<prefix><#FFF6E0><shadow:#000000:1>import: created=<#B6D7A8><created></#B6D7A8> skipped=<#FFCF1F><skipped></#FFCF1F> provisioned=<#B6D7A8><provisioned></#B6D7A8> <#FFF6E0>(world=<world>, prefix=<region_prefix>)</shadow></#FFF6E0>"
  rent:
    resync:
      result: "<prefix><#FFF6E0><shadow:#000000:1>rent resync: <#B6D7A8><count></#B6D7A8> <#FFF6E0>stall(s) updated to the current default rent terms</shadow></#FFF6E0>"
    extendall:
      result: "<prefix><#FFF6E0><shadow:#000000:1>rent extendall <#FFCF1F><duration></#FFCF1F>: updated=<#B6D7A8><updated></#B6D7A8> recovered=<#B6D7A8><recovered></#B6D7A8> skipped=<#FFCF1F><skipped></#FFCF1F> failed=<#FFD0C6><failed></#FFD0C6></shadow></#FFF6E0>"
      invalid_duration: "<prefix><shadow:#000000:1><#FFD0C6>Invalid duration:</#FFD0C6> <duration> <#FFF6E0>(use a positive whole number followed by m, h, or d; e.g. 30m, 12h, 7d)</#FFF6E0></shadow>"
      unavailable: "<prefix><shadow:#000000:1><#FFD0C6>Bulk rent extension service is unavailable.</#FFD0C6></shadow>"
  pricing:
    preview:
      empty: "<prefix><shadow:#000000:1><#FFCF1F>No pricing rows found — no stalls with resolvable region geometry for world=<world> prefix=<region_prefix>. Check the regions or run <#FFF6E0>/em import</#FFF6E0> first.</shadow>"
      header: "<prefix><shadow:#000000:1><#FFCF1F>Volume pricing preview:</#FFCF1F> <#FFF6E0><count> stall(s) — no changes written</#FFF6E0></shadow>"
      row: "<#FFF6E0><shadow:#000000:1>  <#FFCF1F><stall></#FFCF1F> <#FFF6E0>volume=<#FFF6E0><volume></#FFF6E0> blocks</#FFF6E0> <#FFF6E0>→ rent <#FFCF1F><rent></#FFCF1F></shadow></#FFF6E0>"
    apply:
      result: "<prefix><#FFF6E0><shadow:#000000:1>pricing apply: <#B6D7A8><count></#B6D7A8> <#FFF6E0>stall(s) updated to volume-based rent</shadow></#FFF6E0>"
    unavailable: "<prefix><shadow:#000000:1><#FFD0C6>Volume pricing service is unavailable.</#FFD0C6></shadow>"
  reload:
    success: "<prefix><#FFF6E0><shadow:#000000:1>config reloaded <#FFF6E0>(world=<world>, prefix=<region_prefix>)</shadow></#FFF6E0>"
    failure: "<prefix><shadow:#000000:1><#FFD0C6>reload failed: <reason></shadow>"
  list:
    header: "<#FFCF1F>Market stalls</#FFCF1F> <#FFF6E0>· <count> total · <page>/<pages></#FFF6E0>"
    empty: "<#FFF6E0>No market stalls are registered.</#FFF6E0>"
    invalid: "<#FFCF1F>Choose a page from 1 to <pages>.</#FFCF1F>"
    row: "<#FFCF1F><label></#FFCF1F> <#F0E5CD>· </#F0E5CD>"
    details: "<#FFCF1F><id></#FFCF1F><newline><#FFF6E0><world> / <region></#FFF6E0>"
